<!doctype html>
<html lang="es-AR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridg-It</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f4eee2; color: #212422; font: 1rem/1.5 system-ui,sans-serif; }
main { max-width: 39rem; margin: auto; padding: clamp(1rem, 5vw, 2.5rem); }
h1 { font: bold clamp(2.5rem, 10vw, 4.5rem)/1 Georgia, serif; margin: .2em 0; }
p { margin: .6rem 0; }
.controls { display: flex; gap: .5rem 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; margin: 1.1rem 0 .6rem; }
#status { font-weight: 750; }
#reset { font: inherit; background: #fffdf6; border: 1px solid #888075; color: inherit; border-radius: .45rem; min-height: 44px; padding: .3rem .75rem; cursor: pointer; }
.red { --ink: #ad282d; }
.blue { --ink: #1757a2; }
strong { color: var(--ink); }
#board { position: relative; aspect-ratio: 1; background: #fffdf6; border: 1px solid #d0c8bb; border-radius: .9rem; }
.dot, .edge, .goal { position: absolute; transform: translate(-50%, -50%); }
.dot { z-index: 2; width: clamp(10px, 3vw, 18px); aspect-ratio: 1; border-radius: 50%; background: var(--ink); pointer-events: none; }
.dot.blue { border-radius: 22%; }
.goal { width: 80%; height: 2%; background: var(--ink); border-radius: 8px; opacity: .33; pointer-events: none; }
.goal.vertical { width: 2%; height: 80%; }
.edge { --length: 20%; width: var(--length); height: 7%; border: 0; padding: 0; background: transparent; color: var(--ink); }
.edge.vertical { width: 7%; height: var(--length); }
.edge::after { content: ""; position: absolute; width: 100%; height: 4px; left: 0; top: 50%; transform: translateY(-50%); border-radius: 5px; }
.edge.vertical::after { width: 4px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }
.edge:enabled { cursor: pointer; z-index: 1; }
.edge:enabled::after { background: currentColor; opacity: .22; }
.edge:enabled:hover::after, .edge:focus-visible::after { opacity: .7; }
.edge.played::after { background: currentColor; opacity: 1; }
.edge.win::after { box-shadow: 0 0 0 3px #e7c15d; }
:focus-visible { outline: 2px solid #222; outline-offset: 2px; }
</style>
<main>
<nav aria-label="Navegación"><a href="index.html" style="display:inline-block;padding:10px 0;color:inherit">Volver a Juegos para pensar</a></nav>
  <h1>Bridg-It</h1>
  <p>De a dos. Por turnos, hagan clic en un puente disponible para unir dos puntos vecinos de su color. Los puentes no pueden cruzarse.</p>
  <p><strong class="red">Rojo</strong> conecta izquierda con derecha. <strong class="blue">Azul</strong> conecta arriba con abajo. Gana quien completa primero su camino.</p>
  <div class="controls">
    <span id="status" role="status"></span>
    <button id="reset" type="button">Reiniciar partida</button>
  </div>
  <div id="board" role="group" aria-label="Tablero de Bridg-It"></div>
</main>
<script>
const board = document.querySelector('#board');
const status = document.querySelector('#status');
const sides = {
  red: { name: 'Rojo', axis: 'x', first: 1, last: 9 },
  blue: { name: 'Azul', axis: 'y', first: 1, last: 9 }
};
const vertices = [];
const edges = [];
const midpoints = new Map();
let turn;
let winner;

function place(element, x, y) {
  element.style.left = (x * 10) + '%';
  element.style.top = (y * 10) + '%';
  board.append(element);
}

for (const [color, x, y, direction] of [
  ['red', 1, 5, 'vertical'], ['red', 9, 5, 'vertical'],
  ['blue', 5, 1, 'horizontal'], ['blue', 5, 9, 'horizontal']
]) {
  const marker = document.createElement('span');
  marker.className = 'goal ' + color + ' ' + direction;
  marker.setAttribute('aria-hidden', 'true');
  place(marker, x, y);
}

for (let y = 1; y <= 9; y++) {
  for (let x = 1; x <= 9; x++) {
    if ((x + y) % 2 === 0) continue;
    const color = x % 2 ? 'red' : 'blue';
    const dot = document.createElement('span');
    dot.className = 'dot ' + color;
    dot.setAttribute('aria-hidden', 'true');
    place(dot, x, y);
    vertices.push({ x, y, color, edges: [] });
  }
}

for (const a of vertices) {
  for (const b of vertices) {
    const vertical = a.x === b.x && b.y === a.y + 2;
    const horizontal = a.y === b.y && b.x === a.x + 2;
    if (!vertical && !horizontal) continue;
    const axis = sides[a.color].axis;
    if (a[axis] === b[axis] && [1, 9].includes(a[axis])) continue;
    const x = (a.x + b.x) / 2;
    const y = (a.y + b.y) / 2;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'edge ' + a.color + (vertical ? ' vertical' : '');
    button.setAttribute('aria-label', `Puente ${sides[a.color].name.toLowerCase()} ${vertical ? 'vertical' : 'horizontal'} en fila ${y}, columna ${x}`);
    const edge = { a, b, button, played: false, crossing: midpoints.get(x + ',' + y) };
    if (edge.crossing) edge.crossing.crossing = edge;
    midpoints.set(x + ',' + y, edge);
    edges.push(edge);
    a.edges.push(edge);
    b.edges.push(edge);
    place(button, x, y);
    button.addEventListener('click', () => play(edge));
  }
}

function winningPath(color) {
  const { axis, first, last } = sides[color];
  const queue = vertices.filter(dot => dot.color === color && dot[axis] === first);
  const seen = new Set(queue);
  const previous = new Map();
  for (const dot of queue) {
    if (dot[axis] === last) {
      const path = [];
      for (let current = dot; previous.has(current);) {
        const { from, edge } = previous.get(current);
        path.push(edge);
        current = from;
      }
      return path;
    }
    for (const edge of dot.edges) {
      const next = edge.a === dot ? edge.b : edge.a;
      if (!edge.played || seen.has(next)) continue;
      seen.add(next);
      previous.set(next, { from: dot, edge });
      queue.push(next);
    }
  }
  return [];
}

function render() {
  status.textContent = winner ? '¡Ganó ' + sides[winner].name + '!' : 'Turno de ' + sides[turn].name;
  for (const edge of edges) {
    edge.button.disabled = Boolean(winner || edge.a.color !== turn || edge.played || edge.crossing?.played);
    edge.button.classList.toggle('played', edge.played);
  }
}

function play(edge) {
  if (edge.button.disabled) return;
  edge.played = true;
  const path = winningPath(turn);
  if (path.length) {
    winner = turn;
    for (const bridge of path) bridge.button.classList.add('win');
  } else {
    turn = turn === 'red' ? 'blue' : 'red';
  }
  render();
}

function reset() {
  turn = 'red';
  winner = null;
  for (const edge of edges) {
    edge.played = false;
    edge.button.classList.remove('win');
  }
  render();
}

document.querySelector('#reset').addEventListener('click', reset);
reset();
</script>
</html>
